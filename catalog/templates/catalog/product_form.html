{% extends 'catalog/base.html' %}

{% block title %}Форма продукта{% endblock %}

{% block content %}
{% include 'catalog/header.html' %}
<h2>Форма продукта</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Сохранить</button>
    {% if perms.user.can_unpublish_product %}
        <a href="{% url 'catalog:home' %}" class="btn btn-danger">Отмена</a>
    {% endif %}
</form>
{% endblock %}
